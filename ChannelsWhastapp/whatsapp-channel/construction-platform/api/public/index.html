<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedra &amp; Luz · Plataforma de Obra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Pedra <span class="brand-dot">&amp;</span> Luz <small>Obra</small></div>
    <div class="roles">
      <span class="roles-label">Ver como</span>
      <button class="role-btn" data-role="customer">👤 Ilya <small>cliente</small></button>
      <button class="role-btn" data-role="worker">👷 Franek <small>obra</small></button>
      <button class="role-btn active" data-role="founder">🧭 Pedro <small>gestor</small></button>
    </div>
    <div class="notif-wrapper" id="notifWrapper">
      <button class="notif-bell" id="notifBell" onclick="toggleNotifications()">
        🔔 <span class="notif-badge" id="notifBadge" style="display:none">0</span>
      </button>
      <div class="notif-dropdown" id="notifDropdown" style="display:none">
        <div class="notif-header">Notificações</div>
        <div class="notif-list" id="notifList"></div>
      </div>
    </div>
  </header>

  <main id="app">
    <div id="banner" class="banner"></div>
    <section id="project" class="project"></section>
    <section id="budget" class="card budget-card"></section>
    <div class="grid">
      <section id="gallery" class="card"></section>
      <section id="milestones" class="card"></section>
      <section id="selections" class="card"></section>
      <section id="logs" class="card"></section>
      <section id="tasks" class="card"></section>
      <section id="materials" class="card"></section>
      <section id="changeOrders" class="card"></section>
    </div>
  </main>

  <div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
    <span class="lb-count" id="lbCount"></span>
    <button class="lb-btn lb-close" onclick="closeLightbox()" aria-label="Fechar">✕</button>
    <button class="lb-btn lb-prev" onclick="lbNav(-1)" aria-label="Anterior">‹</button>
    <img id="lbImg" alt="" />
    <button class="lb-btn lb-next" onclick="lbNav(1)" aria-label="Seguinte">›</button>
    <div class="lb-cap"><div class="lb-date" id="lbDate"></div><div id="lbNote"></div></div>
  </div>

  <footer class="footer">
    <span id="who"></span> · dados reais via API · <code>DEMO_MODE</code> · <a href="bot.html">💬 Assistente IA</a> · <a href="admin.html">⚙️ Admin</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
