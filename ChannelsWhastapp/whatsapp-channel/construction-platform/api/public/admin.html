<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Construction Platform</title>
<link rel="stylesheet" href="style.css" />
<style>
  .admin-wrap { max-width: 920px; margin: 0 auto; padding: 18px; }
  .admin-card { background:#fff; border:1px solid #e6e9ef; border-radius:12px; padding:18px 20px; margin:16px 0; }
  .admin-card h2 { margin:0 0 12px; font-size:18px; }
  table.admin { width:100%; border-collapse:collapse; }
  table.admin th, table.admin td { text-align:left; padding:8px 10px; border-bottom:1px solid #eef0f4; font-size:14px; vertical-align:middle; }
  table.admin th { color:#8a93a2; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  table.admin input, table.admin select, .row-form input, .row-form select {
    padding:7px 9px; border:1px solid #d4d9e2; border-radius:8px; font-size:14px; }
  .btn { cursor:pointer; border:0; border-radius:8px; padding:8px 14px; font-weight:600; font-size:13px; background:#25D366; color:#06140c; }
  .btn.alt { background:#34a0ff; color:#02101f; }
  .btn.ghost { background:#f1f3f7; color:#333; border:1px solid #d4d9e2; }
  .row-form { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:linear-gradient(90deg,#1f3a5f,#3b2e63); color:#fff; }
  .topbar a { color:#cfe9ff; text-decoration:none; font-size:14px; }
  .msg { font-size:13px; margin-left:8px; }
  .msg.ok { color:#1f9d57; } .msg.err { color:#d23; }
  .mono { font-family:ui-monospace,Menlo,monospace; color:#667; font-size:13px; }
</style>
</head>
<body>
  <div class="topbar">
    <strong>⚙️ Admin — Pessoas &amp; Projeto</strong>
    <a href="./">← Voltar ao painel</a>
  </div>

  <div class="admin-wrap">
    <div class="admin-card">
      <h2>👥 Utilizadores</h2>
      <table class="admin" id="usersTable">
        <thead><tr><th>Nome</th><th>Função</th><th>Telefone</th><th></th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>

      <div class="row-form">
        <input id="newName" placeholder="Nome" />
        <select id="newRole">
          <option value="worker">worker</option>
          <option value="customer">customer</option>
          <option value="founder">founder</option>
          <option value="admin">admin</option>
        </select>
        <input id="newPhone" placeholder="Telefone (ex: 351900000010)" />
        <button class="btn alt" onclick="addUser()">+ Adicionar</button>
        <span class="msg" id="addMsg"></span>
      </div>
    </div>

    <div class="admin-card">
      <h2>🏗️ Projeto</h2>
      <div id="projectForm" class="row-form" style="flex-direction:column; align-items:stretch; gap:10px;">
        <label>Nome <input id="pName" style="width:100%" /></label>
        <label>Morada <input id="pAddress" style="width:100%" /></label>
        <label>Orçamento (€) <input id="pBudget" type="number" /></label>
        <div>
          <button class="btn" onclick="saveProject()">Guardar projeto</button>
          <span class="msg" id="projMsg"></span>
        </div>
      </div>
      <p class="mono" id="noProject" style="display:none">Sem projeto para editar (faça seed no painel primeiro).</p>
    </div>
  </div>

<script src="admin.js"></script>
</body>
</html>
