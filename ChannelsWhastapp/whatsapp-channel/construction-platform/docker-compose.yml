# Construction WhatsApp Platform — runnable demo stack.
#
#   docker compose up --build
#   → Postgres boots, API runs migrations, dashboard at http://localhost:4000/app/
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: construction
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d construction"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/construction
      INTERNAL_TOKEN_SECRET: demo-secret-change-me
      DEMO_MODE: "1"
      PORT: "4000"
      HOST: "0.0.0.0"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
